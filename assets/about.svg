<rect width="900" height="201" rx="16" fill="url(#ab-bg)" stroke="#C77B9B" stroke-opacity=".35"/><rect width="900" height="201" rx="16" fill="url(#ab-gr)"/><text x="28" y="38" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#C77B9B" letter-spacing="3">// WHO I AM</text><rect x="28" y="50" width="70" height="3" rx="1.5" fill="url(#ab-ln)"><animate attributeName="width" values="40;140;40" dur="6s" repeatCount="indefinite"/></rect><text x="28" y="86" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#F8F0F3" opacity=".93">BS Information Technology student (7th semester, UMT) with hands-on experience in Flutter, AI/ML and</text><text x="28" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#F8F0F3" opacity=".93">data analysis through four remote internships. I have built a deployed ML model, a complete Flutter</text><text x="28" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#F8F0F3" opacity=".93">shopping app, interactive data dashboards, a REST API and a Dockerized cloud deployment.</text><text x="28" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#F8F0F3" opacity=".93">Currently seeking a remote internship in software development: web, mobile, cloud or data/AI roles.</text>
